<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хусах карт — жижиг урилга</title>
<meta name="description" content="Алтлаг бүрхүүлийг хусаад асуултаа уншаарай.">
<meta property="og:type" content="website">
<meta property="og:title" content="Хусах карт — жижиг урилга">
<meta property="og:description" content="Алтлаг бүрхүүлийг хусаад асуултаа уншаарай.">
<meta property="og:locale" content="mn_MN">
<meta property="og:image" content="https://ghostshdee.github.io/urilga-bolzoo/assets/og.jpg">
<meta name="theme-color" content="#F7F1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Onest:wght@400;500;600&display=swap">
<style>
:root {
  --paper: #EFE4D8;
  --card:  #FFFBF6;
  --ink:   #3B2E28;
  --muted: #8A776B;
  --line:  #E6D6C6;
  --rose:  #B86B8E;
  --gold:  #B9A7F0;
  --lilac: #C8B6FF;
  --aqua:  #9EE6E0;
  --peach: #FFC8A8;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100dvh; background: radial-gradient(120% 80% at 50% 0%, #F7EEE4, var(--paper) 70%); color: var(--ink);
  font: 16px/1.5 Onest, system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); overflow-x: hidden;
}
main { width: 100%; max-width: 380px; text-align: center; }
.hidden { display: none !important; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
h1, .ask { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; }
h1 { font-size: 34px; line-height: 1.15; margin: 0 0 24px; }
.btn {
  appearance: none; border: 0; border-radius: 999px; cursor: pointer;
  font: 600 16px/1 Onest, sans-serif; padding: 15px 26px; min-height: 48px;
  background: var(--rose); color: #fff; transition: transform .2s, font-size .2s, padding .2s;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.card {
  position: relative; background: var(--card); border-radius: 22px;
  border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(44,38,34,.08);
  padding: 30px 22px; overflow: hidden;
}
.card::before {
  content: ""; position: absolute; inset: 8px; border: 1px dashed var(--line);
  border-radius: 16px; pointer-events: none;
}
.ask { font-size: 32px; line-height: 1.2; margin: 6px 0 4px; min-height: 120px;
  text-align: center; text-wrap: balance; padding-top: 18px; }  /* flex биш — текст ба <em> нэг мөрөнд урсана */
.card { -webkit-user-select: none; user-select: none; }
.ask em { color: var(--rose); font-style: italic; }
.sig { color: var(--muted); font-size: 14px; margin: 0; }
.scratch-wrap { position: relative; border-radius: 14px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 14px;
  touch-action: none; cursor: grab; transition: opacity .6s; }
canvas.gone { opacity: 0; transform: scale(1.06); pointer-events: none; transition: opacity .7s, transform .7s; }
canvas.gone + .sheen { opacity: 0; transition: opacity .3s; }
/* Голограм бүрхүүлийн гялбаа — зөвхөн transform */
.sheen { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; pointer-events: none; }
.sheen::before { content: ""; position: absolute; top: -20%; bottom: -20%; left: -40%; width: 30%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: sheen 2.8s linear infinite; }
@keyframes sheen { to { transform: translateX(500%); } }
/* Дэвсгэрийн pastel толбо — fixed, хуруунд саад болохгүй */
.bg { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
.bg i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(60px); opacity: .35;
  animation: drift 18s ease-in-out infinite alternate; }
.bg i:nth-child(1) { background: var(--lilac); left: -20vmax; top: -20vmax; }
.bg i:nth-child(2) { background: var(--aqua); right: -25vmax; top: 30%; animation-delay: -6s; }
.bg i:nth-child(3) { background: var(--peach); left: 10%; bottom: -30vmax; animation-delay: -12s; }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.1); } }
/* Карт хөвөх + гэрлийн ойлт */
#game .card { animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.card::after { content: ""; position: absolute; inset: -50% auto -50% -60%; width: 40%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
  transform: rotate(12deg) translateX(0); animation: glint 7s ease-in-out infinite; }
@keyframes glint { 0%, 60% { transform: rotate(12deg) translateX(0); } 100% { transform: rotate(12deg) translateX(520%); } }
.hint { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 13px; cursor: pointer; padding: 8px; }
.answers { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 22px; min-height: 52px; flex-wrap: wrap; }
.step h2 { font: 600 15px/1.3 Onest, sans-serif; margin: 20px 0 10px; text-align: left; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
  padding: 10px 14px; font: 500 15px Onest, sans-serif; cursor: pointer; min-height: 44px; }
.chip[aria-pressed="true"] { background: var(--rose); border-color: var(--rose); color: #fff; }
.msg { background: var(--paper); border-radius: 14px; padding: 14px; margin: 20px 0 12px; font-size: 17px; }
.row { display: flex; flex-direction: column; gap: 10px; }
.toast { min-height: 22px; font-size: 14px; color: var(--rose); margin-top: 8px; }
.link { display: inline-block; margin-top: 10px; font-size: 14px; color: var(--ink); font-weight: 600; }
/* Хөвөх дууны самбар — 280×158 тоглогч; хураахдаа height:0 (iframe устахгүй, дуу зогсохгүй) */
body.has-music { padding-bottom: calc(210px + env(safe-area-inset-bottom)); }
.music { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5; width: 296px;
  background: rgba(255,251,246,.92); border: 1px solid var(--line); border-radius: 16px; padding: 8px;
  box-shadow: 0 10px 30px rgba(59,46,40,.15); font-size: 13px; text-align: left; }
.music .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px 6px; }
.music .player { height: 158px; overflow: hidden; border-radius: 10px; transition: height .3s; }
.music iframe { width: 280px; height: 158px; border: 0; display: block; }
.music .tip { margin: 6px 4px 0; color: var(--muted); font-size: 12px; }
.music.min { width: auto; } .music.min .player { height: 0; } .music.min .tip { display: none; }
.music button { border: 0; background: none; font: 500 13px Onest, sans-serif; color: var(--ink); cursor: pointer; padding: 8px; min-height: 36px; }
footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
footer a { color: var(--ink); font-weight: 600; }
/* Оч ба конфетти — бүгд CSS, transform/opacity */
.spark { position: fixed; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 9; animation: spark .6s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
.conf { position: fixed; top: -20px; width: 8px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 10;
  animation: fall 1.5s cubic-bezier(.3,.6,.6,1) forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .spark, .conf { display: none; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <section id="cover">
    <p class="eyebrow">Хусах карт</p>
    <h1 id="coverTitle">Сараад зориулсан урилга</h1>
    <button class="btn" id="openBtn" type="button">💌 Нээх</button>
  </section>

  <section id="game" class="hidden">
    <p class="eyebrow" id="eyebrow">Сараад</p>
    <div class="card">
      <div class="scratch-wrap" id="wrap">
        <p class="ask" id="ask"></p>
        <p class="sig" id="sig"></p>
        <canvas id="foil" aria-hidden="true"></canvas>
        <div class="sheen" aria-hidden="true"></div>
      </div>
      <p class="hint" id="hint">Үүнийг хусаарай ✨ — хуруугаараа</p>
      <button class="linkish" id="skipBtn" type="button">Хусахгүйгээр нээх</button>
      <div class="answers hidden" id="answers">
        <button class="btn" id="yesBtn" type="button">Тийм</button>
        <button class="btn ghost" id="noBtn" type="button">Үгүй</button>
      </div>
    </div>
  </section>

  <section id="plan" class="hidden">
    <h1>Йэй! 💛</h1>
    <div class="card">
      <div id="whenBox">
        <div class="step"><h2>Аль өдөр?</h2><div class="chips" id="days"></div></div>
        <div class="step"><h2>Хэдэн цагт?</h2><div class="chips" id="hours"></div></div>
        <div class="step"><h2>Хаана?</h2><div class="chips" id="places"></div></div>
      </div>
      <p class="msg" id="msg" aria-live="polite"></p>
      <div class="row">
        <button class="btn" id="sendBtn" type="button"><span aria-hidden="true">💬</span> Мессеж илгээх</button>
        <button class="btn ghost" id="copyBtn" type="button"><span aria-hidden="true">📋</span> Чатанд хуулах</button>
        <a class="link hidden" id="msLink" href="#" target="_blank" rel="noopener">Messenger нээх →</a>
      </div>
      <p class="toast" id="toast" role="status"></p>
    </div>
  </section>

  <footer>Dokay-оор хийсэн · <a href="make.html">Өөрийнхөөрөө хийх →</a></footer>
</main>

<div class="music hidden" id="music">
  <div class="bar"><span>♪ дуу</span><button type="button" id="minBtn" aria-expanded="true">— жижигрүүлэх</button></div>
  <div class="player" id="player"></div>
  <p class="tip">Дуу эхлээгүй бол тоглогч дээр нэг дараарай ▶</p>
</div>

<script>
function readGift() {
  const m = location.hash.match(/[#&]d=([A-Za-z0-9_-]{1,2000})/);
  if (!m) return null;
  try {
    const b = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
    const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))));
    const s = (v, n) => typeof v === 'string' ? v.replace(/[<>"'`&]/g, '').trim().slice(0, n) : '';
    return {
      to: s(o.to, 24), from: s(o.from, 24), ask: s(o.ask, 120),
      yt: /^[A-Za-z0-9_-]{11}$/.test(o.yt) ? o.yt : '',
      t: Number.isInteger(o.t) && o.t >= 0 && o.t <= 36000 ? o.t : 0,
      ph: /^\+?[0-9]{6,15}$/.test(o.ph) ? o.ph : '',
      ms: /^[A-Za-z0-9.]{1,50}$/.test(o.ms) ? o.ms : '',
      vid: o.vid !== 0,
      when: o.when !== 0
    };
  } catch (e) { return null; }
}

// Анхдагч жишээ — линкгүй эсвэл буруу өгөгдөлтэй үед
const DEF = { to: 'Сараа', from: 'Батаа', ask: 'Надтай *болзоонд* явах уу?', yt: '', t: 0, ph: '', ms: '', when: true };
const g = readGift() || DEF;
const G = { to: g.to || DEF.to, from: g === DEF ? DEF.from : g.from,  /* линктэй бол жишээ нэр гаргахгүй */ ask: g.ask || DEF.ask,
  yt: g.yt, t: g.t, ph: g.ph, ms: g.ms, when: g.when, vid: g.vid };

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Нэр, асуулт — зөвхөн textContent; *үг* → <em> DOM-оор
$('coverTitle').textContent = G.to + ', чамд зориулсан урилга';
$('eyebrow').textContent = G.to + ', чамд';
$('sig').textContent = G.from ? '— ' + G.from : '';
document.title = G.to + ', чамд зориулсан урилга';
G.ask.split('*').forEach((part, i) => {
  if (!part) return;
  if (i % 2) { const em = document.createElement('em'); em.textContent = part; $('ask').appendChild(em); }
  else $('ask').appendChild(document.createTextNode(part));
});

// 1. Нээх — товшилт дууг эхлүүлнэ
function startMusic() {
  if (!G.yt) return;
  const box = $('music');
  box.classList.remove('hidden');
  document.body.classList.add('has-music');
  const old = $('player').querySelector('iframe');
  if (old) old.remove();
  const f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media; picture-in-picture';
  f.title = 'Дуу';
  f.src = 'https://www.youtube-nocookie.com/embed/' + G.yt + '?autoplay=1&start=' + G.t + '&playsinline=1&rel=0';
  $('player').appendChild(f);
}
$('minBtn').addEventListener('click', () => { const m = $('music').classList.toggle('min');
  $('minBtn').textContent = m ? '♪ томруулах' : '— жижигрүүлэх'; $('minBtn').setAttribute('aria-expanded', String(!m)); });
// Бүтээгч «дүрсийг харуулахгүй» гэсэн бол хураасан эхэлнэ — дуу тоглосоор
if (G.vid === false) { $('music').classList.add('min'); $('minBtn').textContent = '▶ Дүрс харах'; $('minBtn').setAttribute('aria-expanded','false'); }
$('openBtn').addEventListener('click', () => {
  startMusic();
  $('cover').classList.add('hidden');
  $('game').classList.remove('hidden');
  setupFoil();
});

// Хусах бүрхүүл (canvas)
const cv = $('foil'); const ctx = cv.getContext('2d');
let revealed = false, drawing = false, last = null, moves = 0;
function setupFoil() {
  const r = $('wrap').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = r.width, h = r.height;
  const gr = ctx.createLinearGradient(0, 0, w, h);
  // Голограм: lilac → aqua → peach + 140 гялтганах ширхэг
  gr.addColorStop(0, '#C8B6FF'); gr.addColorStop(.35, '#9EE6E0'); gr.addColorStop(.7, '#FFC8A8'); gr.addColorStop(1, '#C8B6FF');
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 140; i++) { ctx.fillStyle = i % 3 ? 'rgba(255,255,255,.6)' : 'rgba(170,140,255,.5)';
    const s = Math.random() * 1.8 + .6; ctx.fillRect(Math.random() * w, Math.random() * h, s, s); }
  ctx.fillStyle = 'rgba(59,46,40,.72)'; ctx.font = '600 18px Onest, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Үүнийг хусаарай ✨', w / 2, h / 2);
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 38;
}
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function scratch(p) {
  ctx.beginPath();
  if (last) { ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
  else { ctx.arc(p.x, p.y, 19, 0, Math.PI * 2); ctx.fill(); }
  last = p;
  if (++moves % 8 === 0) checkCleared();
  if (moves % 3 === 0) sparks(p);
}
// Хурууны дор pastel оч — нэг зэрэг 24-өөс ихгүй
const PAL = ['#C8B6FF', '#9EE6E0', '#FFC8A8', '#fff']; let live = 0;
function sparks(p) { if (reduce || live > 24) return; const r = cv.getBoundingClientRect();
  for (let i = 0; i < 2; i++) { const s = document.createElement('span'); s.className = 'spark'; live++;
    s.style.left = (r.left + p.x) + 'px'; s.style.top = (r.top + p.y) + 'px'; s.style.background = PAL[i + moves % 2 * 2];
    s.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px'); s.style.setProperty('--dy', (Math.random() * -36 - 6) + 'px');
    document.body.appendChild(s); setTimeout(() => { s.remove(); live--; }, 650); } }
function checkCleared() {
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let clear = 0, total = 0;
  for (let i = 3; i < d.length; i += 4 * 24) { total++; if (d[i] < 128) clear++; }
  if (clear / total >= 0.55) reveal();
}
cv.addEventListener('pointerdown', e => { if (revealed) return; drawing = true; last = null; cv.setPointerCapture(e.pointerId); scratch(pos(e)); });
cv.addEventListener('pointermove', e => { if (drawing) scratch(pos(e)); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { if (drawing) { drawing = false; last = null; checkCleared(); } }));
window.addEventListener('resize', () => { if (!revealed && !$('game').classList.contains('hidden')) setupFoil(); });

function reveal() {
  if (revealed) return;
  revealed = true;
  cv.classList.add('gone');
  confetti();
  $('hint').classList.add('hidden'); $('skipBtn').classList.add('hidden');
  $('answers').classList.remove('hidden');
  $('yesBtn').focus();
}
$('skipBtn').addEventListener('click', reveal);

// 2. «Үгүй» — товшилт бүрд жижгэрч, эцэст нь «Тийм» болно
const noLines = ['Итгэлтэй юу?', 'Дахиад бод', 'Сайн бодоорой'];
let noCount = 0;
$('noBtn').addEventListener('click', () => {
  const b = $('noBtn');
  if (noCount >= noLines.length) { yes(); return; }
  b.textContent = noLines[noCount++];
  b.style.fontSize = (16 - noCount * 2) + 'px';
  b.style.padding = (15 - noCount * 3) + 'px ' + (26 - noCount * 5) + 'px';
  $('yesBtn').style.transform = 'scale(' + (1 + noCount * 0.12) + ')';
  if (noCount === noLines.length) { b.textContent = 'Тийм'; b.classList.remove('ghost'); b.style.cssText = ''; }
});
$('yesBtn').addEventListener('click', yes);

// 3. Баяр + өдөр/цаг/газар
const pick = { day: '', hour: '', place: '' };
// Pastel конфетти — 36 ширхэг, 1.5 секунд, бүгд CSS
function confetti() { if (reduce) return; for (let i = 0; i < 36; i++) { const c = document.createElement('span');
  c.className = 'conf'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = PAL[i % 4 === 3 ? 0 : i % 3];
  c.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px'); c.style.animationDelay = Math.random() * .3 + 's';
  document.body.appendChild(c); setTimeout(() => c.remove(), 2000); } }
function chips(box, items, key) {
  box.textContent = '';
  items.forEach(label => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = label;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      box.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      pick[key] = label;
      if (key === 'day') buildHours();
      updateMsg();
    });
    box.appendChild(b);
  });
}
const WD = ['Ням', 'Даваа', 'Мягмар', 'Лхагва', 'Пүрэв', 'Баасан', 'Бямба'];
const HOURS = ['12:00', '14:00', '17:00', '19:00', '20:00'];
function buildHours() {
  const now = new Date().getHours();
  let list = pick.day === 'Өнөөдөр' ? HOURS.filter(h => parseInt(h, 10) > now) : HOURS;
  if (!list.length) list = ['Оройтуулаад'];
  if (!list.includes(pick.hour)) pick.hour = '';
  chips($('hours'), list, 'hour');
  if (pick.hour) [...$('hours').children].forEach(b => { if (b.textContent === pick.hour) b.setAttribute('aria-pressed', 'true'); });
}
function yes() {
  confetti();
  $('game').classList.add('hidden');
  $('plan').classList.remove('hidden');
  if (G.when) {
    const days = ['Өнөөдөр', 'Маргааш'];
    for (let i = 2; i < 7; i++) days.push(WD[(new Date().getDay() + i) % 7] + ' гараг');
    chips($('days'), days, 'day');
    buildHours();
    chips($('places'), ['Кино', 'Кофе', 'Оройн хоол', 'Алхах'], 'place');
  } else {
    $('whenBox').classList.add('hidden');
  }
  if (G.ms) $('msLink').href = 'https://m.me/' + G.ms;
  updateMsg();
  window.scrollTo(0, 0);
}

// 4. Хариу
function message() {
  const SAY = { 'Кино': 'кино үзэхээр', 'Кофе': 'кофе уухаар', 'Оройн хоол': 'оройн хоол идэхээр', 'Алхах': 'алхахаар' };  /* мессежид орох хэлбэр */
  const parts = [pick.day, pick.hour && (/^\d/.test(pick.hour) ? pick.hour + ' цагт' : pick.hour), pick.place && (SAY[pick.place] || pick.place)].filter(Boolean).join(' ');
  return parts ? 'Тийм ээ! ' + parts + ' болзъё 💕' : 'Тийм ээ! Болзъё 💕';
}
function updateMsg() {
  const m = message();
  $('msg').textContent = m;
}
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).catch(() => fallback(t));
  fallback(t); return Promise.resolve();
}
function fallback(t) {
  const a = document.createElement('textarea');
  a.value = t; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); } catch (e) {}
  a.remove();
}
function toast(t) { $('toast').textContent = t; setTimeout(() => { $('toast').textContent = ''; }, 3500); }
// Мессеж илгээх: утас байвал sms → үгүй бол share цонх → дэмжихгүй/алдаа бол sms
function smsUrl(m) { return 'sms:' + (G.ph || '') + '?&body=' + encodeURIComponent(m); }
$('sendBtn').addEventListener('click', () => { const m = message();
  if (G.ph || !navigator.share) { location.href = smsUrl(m); return; }
  navigator.share({ text: m }).catch(e => { if (e && e.name !== 'AbortError') location.href = smsUrl(m); }); });
$('copyBtn').addEventListener('click', () => copyText(message()).then(() => {
  $('copyBtn').textContent = 'Хуулагдлаа ✓ — чатандаа буулгаарай';
  if (G.ms) $('msLink').classList.remove('hidden'); }));
</script>
