<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B1A">
<title>Шөнийн од — жижиг асуулт</title>
<meta name="description" content="Тэнгэрт нэг асуулт оддоос угсрагдаж байна. Нээгээд хариулаарай.">
<meta property="og:type" content="website">
<meta property="og:title" content="Шөнийн од — жижиг асуулт">
<meta property="og:description" content="Тэнгэрт нэг асуулт оддоос угсрагдаж байна. Нээгээд хариулаарай.">
<meta property="og:locale" content="mn_MN">
<meta property="og:url" content="https://ghostshdee.github.io/urilga-bolzoo/stars.html">
<meta property="og:image" content="https://ghostshdee.github.io/urilga-bolzoo/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Болзооны урилга — жишээ зураг">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Onest:wght@400;500;600&display=swap">
<style>
  :root { --bg:#070B1A; --ink:#EDEBFF; --dim:#9BA3C7; --gold:#FFD98A; --glow:255,217,138; }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }
  html, body { min-height:100%; }
  body {
    display:flex; flex-direction:column; min-height:100svh; overflow-x:hidden;
    background:radial-gradient(120% 80% at 50% 0%, #18204A 0%, #0B1030 45%, var(--bg) 100%) fixed var(--bg);
    color:var(--ink); font:400 16px/1.5 Onest, system-ui, sans-serif; -webkit-tap-highlight-color:transparent;
  }
  button { font:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:3px; }

  /* Тэнгэр — од бүр өөрийн хэмнэлээр, зөвхөн opacity/transform */
  .sky { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .milky {
    position:absolute; left:-30%; top:-10%; width:160%; height:70%; opacity:.5; transform:rotate(-24deg);
    background:radial-gradient(50% 22% at 50% 50%, rgba(170,160,255,.16), rgba(120,140,255,.06) 55%, transparent 75%),
               radial-gradient(30% 10% at 40% 52%, rgba(255,230,200,.08), transparent 70%);
    animation:drift 40s ease-in-out infinite alternate;
  }
  @keyframes drift { to { transform:rotate(-24deg) translateX(4%); opacity:.62; } }
  .st {
    position:absolute; width:2px; height:2px; border-radius:50%; background:#fff;
    box-shadow:0 0 4px 1px rgba(255,255,255,.55); opacity:.3;
    animation:tw var(--tw) ease-in-out var(--dl) infinite;
  }
  .st.b { width:3px; height:3px; box-shadow:0 0 6px 2px rgba(var(--glow),.5); }
  @keyframes tw { 0%,100% { opacity:.2; transform:scale(.7); } 50% { opacity:1; transform:scale(1.15); } }
  .halo {
    position:absolute; top:calc(7svh - 28px); right:calc(9vw - 26px); width:110px; height:110px; border-radius:50%;
    background:radial-gradient(circle, rgba(244,231,193,.28), rgba(244,231,193,.08) 45%, transparent 70%);
    animation:glow 6s ease-in-out infinite alternate;
  }
  @keyframes glow { from { opacity:.6; transform:scale(.95); } to { opacity:1; transform:scale(1.08); } }
  .moon {
    position:absolute; top:7svh; right:9vw; width:44px; height:44px; border-radius:50%;
    box-shadow:10px 6px 0 0 #F4E7C1; transform:rotate(-20deg); opacity:.95;
  }
  .shoot {
    position:absolute; width:var(--len); height:2px; border-radius:2px; transform-origin:right center;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,240,210,.85));
    animation:shoot var(--dur) cubic-bezier(.3,.6,.4,1) forwards;
  }
  .shoot::after {
    content:''; position:absolute; right:-2px; top:-1px; width:4px; height:4px; border-radius:50%;
    background:#fff; box-shadow:0 0 8px 3px rgba(var(--glow),.8);
  }
  @keyframes shoot {
    0% { transform:rotate(var(--a)) translateX(0) scaleX(.3); opacity:0; }
    15% { opacity:1; }
    100% { transform:rotate(var(--a)) translateX(-300px) scaleX(1); opacity:0; }
  }
  main, footer { z-index:1; }

  /* Дуу — доод хөвөх самбар; хураахад iframe үлдэнэ (display:none биш) */
  .music {
    position:fixed; left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:5; transform:translateX(-50%);
    width:304px; padding:8px 12px 10px; font-size:12px; color:var(--dim);
    background:rgba(10,14,36,.9); border:1px solid rgba(255,217,138,.28); border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.45), 0 0 18px rgba(var(--glow),.12);
  }
  .music-bar { display:flex; align-items:center; justify-content:space-between; min-height:32px; }
  .music-h { color:var(--gold); font-weight:600; }
  #minBtn { min-height:32px; padding:0 10px; border-radius:999px; border:1px solid rgba(255,255,255,.2); background:transparent; color:var(--ink); font-size:12px; }
  .music-body { overflow:hidden; max-height:220px; opacity:1; transition:max-height .35s, opacity .35s; }
  .music iframe { display:block; width:280px; height:158px; border:0; border-radius:10px; margin-top:4px; }
  .music-tip { margin-top:6px; }
  .music.min .music-body { max-height:0; opacity:0; }
  body.has-music main { padding-bottom:230px; }
  body.has-music.min-music main { padding-bottom:70px; }

  main {
    flex:1; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px 22px 24px; text-align:center;
  }
  .screen { width:100%; max-width:420px; }
  .eyebrow { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  h1, h2 { font-family:'Cormorant Garamond', Georgia, serif; font-weight:500; }
  h1 { font-size:clamp(30px, 8.5vw, 40px); line-height:1.15; margin-top:10px; }
  h2:focus, h1:focus { outline:none; }

  .orb {
    display:grid; place-items:center; width:136px; height:136px; margin:34px auto 20px;
    border:0; border-radius:50%; color:#2A1E05; font-weight:600; font-size:17px;
    background:radial-gradient(circle, #FFF6DC 0%, #FFD98A 34%, rgba(255,217,138,.22) 62%, rgba(255,217,138,0) 72%);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform:scale(1.06); } }
  .hint { color:var(--dim); font-size:14px; }

  /* Асуулт — үсэг бүр эхлээд од, дараа нь байрандаа очиж үсэг болно */
  .to { color:var(--dim); font-size:15px; }
  .ask { font-size:clamp(34px, 10vw, 46px); line-height:1.15; margin:14px 0 12px; min-height:2.3em; }
  .ask em { font-style:italic; color:var(--gold); }
  .w { display:inline-block; white-space:nowrap; }
  .c {
    display:inline-block; position:relative; color:transparent;
    transform:translate(var(--x), var(--y)) scale(.6);
    transition:transform 1.2s cubic-bezier(.2,.8,.2,1) var(--d), color .6s calc(var(--d) + .9s), text-shadow .6s calc(var(--d) + .9s);
  }
  .c::after {
    content:''; position:absolute; left:50%; top:55%; width:6px; height:6px; margin:-3px; border-radius:50%;
    background:#fff; box-shadow:0 0 8px 3px rgba(var(--glow),.8);
    transition:opacity .5s calc(var(--d) + .9s);
  }
  .on .c { transform:none; color:inherit; }
  .on .c::after { opacity:0; }
  .on em .c { text-shadow:0 0 16px rgba(var(--glow),.55); }
  .sign { color:var(--dim); font-style:italic; font-family:'Cormorant Garamond', Georgia, serif; font-size:20px; }

  .choices {
    display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top:26px;
    opacity:0; visibility:hidden; transition:opacity .6s;
  }
  .choices.ready, .sign.ready { opacity:1; visibility:visible; }
  .sign { opacity:0; transition:opacity .6s; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 28px;
    border-radius:999px; font-weight:600; font-size:17px; text-decoration:none; transition:transform .25s, opacity .25s;
  }
  .yes { border:0; color:#241803; background:linear-gradient(#FFE3A3, #FFC76A); box-shadow:0 0 24px rgba(var(--glow),.45); }
  .no, .ghost { background:transparent; color:var(--ink); border:1px solid rgba(237,235,255,.35); }
  .fall { animation:fall .9s ease-in forwards; }
  @keyframes fall { to { transform:translate(120px, 60vh) rotate(40deg) scale(.3); opacity:0; } }

  /* Баяр — оддоос зүрх */
  #heart { width:min(70vw, 240px); height:auto; filter:drop-shadow(0 0 6px rgba(255,217,138,.7)); }
  #heart path { fill:none; stroke:rgba(255,217,138,.6); stroke-width:1.2; transition:stroke-dashoffset 1.6s ease; }
  #heart circle { fill:#FFF3D1; transform-box:fill-box; transform-origin:center; animation:pop .5s backwards; }
  @keyframes pop { from { transform:scale(0); } }
  .yay-t { font-size:clamp(36px, 10vw, 48px); margin-top:8px; }
  .sub { color:var(--dim); }

  /* Өдөр, цаг, газар */
  #planT { font-size:clamp(32px, 9vw, 42px); margin-bottom:6px; }
  .grp-h { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin:18px 0 8px; font-weight:500; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chip {
    min-height:46px; padding:0 16px; border-radius:999px; color:var(--ink);
    border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.04);
  }
  .chip[aria-pressed="true"] { background:var(--gold); color:#241803; border-color:var(--gold); box-shadow:0 0 14px rgba(var(--glow),.5); }
  #reply { margin-top:24px; }
  .msg {
    font-family:'Cormorant Garamond', Georgia, serif; font-style:italic; font-size:24px; line-height:1.3;
    padding:16px 18px; border:1px dashed rgba(255,217,138,.5); border-radius:16px;
  }
  .acts { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  #msLink { display:block; margin-top:4px; color:var(--gold); font-size:14px; }

  footer { text-align:center; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); font-size:13px; color:var(--dim); position:relative; }
  footer a { color:var(--gold); font-weight:600; text-decoration:none; }
  .toast {
    position:fixed; left:50%; top:calc(16px + env(safe-area-inset-top)); z-index:6; transform:translateX(-50%);
    padding:10px 18px; border-radius:999px; background:#FFF3D1; color:#241803; font-size:15px;
    opacity:0; pointer-events:none; transition:opacity .3s; white-space:nowrap;
  }
  .toast.show { opacity:1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <i class="milky"></i><span class="halo"></span><span class="moon"></span>
</div>

<aside id="music" class="music" hidden aria-label="Дуу">
  <div class="music-bar">
    <span class="music-h">♪ дуу</span>
    <button id="minBtn" type="button" aria-expanded="true" aria-controls="musicBody">— жижигрүүлэх</button>
  </div>
  <div id="musicBody" class="music-body">
    <div id="frame"></div>
    <p class="music-tip">Дуу эхлээгүй бол тоглогч дээр нэг дараарай ▶</p>
  </div>
</aside>

<main>
  <section id="cover" class="screen">
    <p class="eyebrow">Шөнийн тэнгэрээс</p>
    <h1 id="toLine" tabindex="-1"></h1>
    <button id="open" class="orb" type="button"><span><span aria-hidden="true">💌</span> Нээх</span></button>
    <p class="hint" id="hint">Одыг товшоорой</p>
  </section>

  <section id="ask" class="screen" hidden>
    <p class="to" id="toName"></p>
    <h2 id="askText" class="ask" tabindex="-1"></h2>
    <p class="sign" id="sign"></p>
    <div id="choices" class="choices">
      <button id="yes" class="btn yes" type="button">Тийм</button>
      <button id="no" class="btn no" type="button">Үгүй</button>
    </div>
  </section>

  <section id="yay" class="screen" hidden>
    <svg id="heart" viewBox="0 0 200 190" aria-hidden="true"></svg>
    <h2 class="yay-t" tabindex="-1">Тийм гэлээ!</h2>
    <p class="sub">Одод ч баярлаж байна <span aria-hidden="true">✨</span></p>
  </section>

  <section id="plan" class="screen" hidden>
    <h2 id="planT" tabindex="-1">Хэзээ, хаана?</h2>
    <div id="when" hidden>
      <h3 class="grp-h" id="hDay">Өдөр</h3><div id="days" class="chips" role="group" aria-labelledby="hDay"></div>
      <h3 class="grp-h" id="hTime">Цаг</h3><div id="times" class="chips" role="group" aria-labelledby="hTime"></div>
      <h3 class="grp-h" id="hPlace">Газар</h3><div id="places" class="chips" role="group" aria-labelledby="hPlace"></div>
    </div>
    <div id="reply" hidden>
      <p class="msg" id="msg"></p>
      <div class="acts">
        <button id="send" class="btn yes" type="button"><span aria-hidden="true">💬</span>&nbsp;Мессеж илгээх</button>
        <button id="copy" class="btn ghost" type="button"><span aria-hidden="true">📋</span>&nbsp;Чатанд хуулах</button>
        <a id="msLink" hidden target="_blank" rel="noopener">Messenger нээх →</a>
      </div>
    </div>
  </section>
</main>

<footer>Dokay-оор хийсэн · <a href="make.html">Өөрийнхөөрөө хийх →</a></footer>
<p id="toast" class="toast" role="status" aria-live="polite"></p>

<script>
  function readGift() {
    const m = location.hash.match(/[#&]d=([A-Za-z0-9_-]{1,2000})/);
    if (!m) return null;
    try {
      const b = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
      const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))));
      const s = (v, n) => typeof v === 'string' ? v.replace(/[<>"'`&]/g, '').trim().slice(0, n) : '';
      return {
        to: s(o.to, 24), from: s(o.from, 24), ask: s(o.ask, 120),
        yt: /^[A-Za-z0-9_-]{11}$/.test(o.yt) ? o.yt : '',
        t: Number.isInteger(o.t) && o.t >= 0 && o.t <= 36000 ? o.t : 0,
        ph: /^\+?[0-9]{6,15}$/.test(o.ph) ? o.ph : '',
        ms: /^[A-Za-z0-9.]{1,50}$/.test(o.ms) ? o.ms : '',
        vid: o.vid !== 0,
        when: o.when !== 0
      };
    } catch (e) { return null; }
  }

  const $ = s => document.querySelector(s);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));

  // Өгөгдөл — линкгүй эсвэл эвдэрсэн бол жишээ (Сараа/Батаа)
  const g = readGift();
  const G = {
    to: (g && g.to) || 'Сараа',
    from: g ? g.from : 'Батаа',  /* линктэй бол жишээ нэр гаргахгүй */
    ask: (g && g.ask) || 'Надтай *болзоонд* явах уу?',
    yt: g ? g.yt : '', t: g ? g.t : 0, ph: g ? g.ph : '', ms: g ? g.ms : '',
    vid: g ? g.vid : true,
    when: g ? g.when : true
  };

  // Тэнгэр — 60–90 од, тус бүр 2–6 с хэмнэл, өөр саатал
  function sky() {
    const box = $('.sky'), n = 60 + (Math.random() * 31 | 0), frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const s = document.createElement('i');
      s.className = Math.random() < .15 ? 'st b' : 'st';
      s.style.left = (Math.random() * 100).toFixed(2) + '%';
      s.style.top = (Math.random() * 100).toFixed(2) + '%';
      s.style.setProperty('--tw', (2 + Math.random() * 4).toFixed(2) + 's');
      s.style.setProperty('--dl', (-Math.random() * 6).toFixed(2) + 's');
      frag.append(s);
    }
    box.append(frag);
  }

  // Харвах од — ташуу, 0.8–1.2 с
  function shoot() {
    if (RM) return;
    const s = document.createElement('i');
    s.className = 'shoot';
    s.style.top = (5 + Math.random() * 40 | 0) + '%';
    s.style.left = (35 + Math.random() * 60 | 0) + '%';
    s.style.setProperty('--a', (-(20 + Math.random() * 20)).toFixed(0) + 'deg');
    s.style.setProperty('--dur', (.8 + Math.random() * .4).toFixed(2) + 's');
    s.style.setProperty('--len', (80 + Math.random() * 60 | 0) + 'px');
    $('.sky').append(s);
    s.addEventListener('animationend', () => s.remove());
  }
  // 5–9 секунд тутамд ганц од; таб нуугдсан үед харвахгүй
  function meteorLoop() {
    if (RM) return;
    setTimeout(() => { if (!document.hidden) shoot(); meteorLoop(); }, 5000 + Math.random() * 4000);
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(el => { el.hidden = el.id !== id; });
    const f = $('#' + id).querySelector('[tabindex="-1"]');
    if (f) f.focus({ preventScroll: true });
  }

  function toast(t) {
    const el = $('#toast');
    el.textContent = t;
    el.classList.add('show');
    clearTimeout(toast.k);
    toast.k = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // Дуу — товшилтын дараа л iframe үүсгэнэ
  function startMusic() {
    if (!G.yt || $('#frame iframe')) return;
    $('#music').hidden = false;
    document.body.classList.add('has-music');
    const f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + G.yt + '?autoplay=1&start=' + G.t + '&playsinline=1&rel=0';
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.title = 'Дуу';
    $('#frame').replaceChildren(f);
  }

  // Асуултыг үсэг бүрээр — *үг* нь <em> (зөвхөн DOM, innerHTML үгүй)
  function buildAsk() {
    const box = $('#askText');
    const plain = G.ask.replace(/\*/g, '');
    box.setAttribute('aria-label', plain);
    const inner = document.createElement('span');
    inner.setAttribute('aria-hidden', 'true');
    const total = Array.from(plain.replace(/\s/g, '')).length || 1;
    let i = 0;
    G.ask.split(/\*([^*]+)\*/).forEach((part, k) => {
      const host = k % 2 ? document.createElement('em') : inner;
      part.replace(/\*/g, '').split(/(\s+)/).forEach(tok => {
        if (!tok) return;
        if (/^\s+$/.test(tok)) { host.append(' '); return; }
        const w = document.createElement('span');
        w.className = 'w';
        for (const ch of tok) {
          const c = document.createElement('span');
          c.className = 'c';
          c.textContent = ch;
          c.style.setProperty('--x', ((Math.random() - .5) * innerWidth | 0) + 'px');
          c.style.setProperty('--y', (-(80 + Math.random() * innerHeight * .45) | 0) + 'px');
          c.style.setProperty('--d', (i++ / total * 1.4).toFixed(2) + 's');
          w.append(c);
        }
        host.append(w);
      });
      if (host !== inner) inner.append(host);
    });
    box.replaceChildren(inner);
  }

  // Оддоос зүрх
  function drawHeart() {
    const NS = 'http://www.w3.org/2000/svg', svg = $('#heart'), pts = [];
    for (let k = 0; k < 12; k++) {
      const t = k / 12 * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      pts.push([(100 + x * 5.4).toFixed(1), (84 - y * 5.4).toFixed(1)]);
    }
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M' + pts.map(q => q.join(' ')).join('L') + 'Z');
    svg.replaceChildren(p);
    pts.forEach((q, k) => {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', q[0]); c.setAttribute('cy', q[1]); c.setAttribute('r', k % 3 ? 2.4 : 3.4);
      c.style.animationDelay = (k * .08) + 's';
      svg.append(c);
    });
    if (!RM && p.getTotalLength) {
      const L = p.getTotalLength();
      p.style.strokeDasharray = L;
      p.style.strokeDashoffset = L;
      requestAnimationFrame(() => requestAnimationFrame(() => { p.style.strokeDashoffset = 0; }));
    }
  }

  // Өдөр, цаг, газар
  const TIMES = ['12:00', '14:00', '17:00', '19:00', '20:00'];
  const PLACES = ['Кино', 'Кофе', 'Оройн хоол', 'Алхах'];
  const SAY = { 'Кино': 'кино үзэхээр', 'Кофе': 'кофе уухаар', 'Оройн хоол': 'оройн хоол идэхээр', 'Алхах': 'алхахаар' };  /* мессежид орох хэлбэр */
  const WD = ['Ням', 'Даваа', 'Мягмар', 'Лхагва', 'Пүрэв', 'Баасан', 'Бямба'];
  const pick = { day: null, time: null, place: null };

  function timesFor(off) {
    if (off) return TIMES;
    const n = new Date(), m = n.getHours() * 60 + n.getMinutes() + 30;
    return TIMES.filter(t => parseInt(t, 10) * 60 > m);
  }
  function days() {
    const out = [], start = timesFor(0).length ? 0 : 1;
    for (let o = start; o < start + 7; o++) {
      const d = new Date();
      d.setDate(d.getDate() + o);
      out.push({ off: o, label: o === 0 ? 'Өнөөдөр' : o === 1 ? 'Маргааш' : WD[d.getDay()] + ' гараг' });
    }
    return out;
  }
  function chips(el, items, cur, onPick) {
    el.replaceChildren.apply(el, items.map(it => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = it.label;
      b.setAttribute('aria-pressed', String(it.key === cur));
      b.onclick = () => {
        el.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        onPick(it.key);
      };
      return b;
    }));
  }
  function renderTimes() {
    const ts = pick.day ? timesFor(pick.day.off) : TIMES;
    if (pick.time && ts.indexOf(pick.time) < 0) pick.time = null;
    chips($('#times'), ts.map(t => ({ key: t, label: t })), pick.time, k => { pick.time = k; check(); });
  }
  function check() { if (pick.day && pick.time && pick.place) showReply(); }
  function buildPlan() {
    $('#when').hidden = false;
    const ds = days();
    chips($('#days'), ds.map(d => ({ key: d.off, label: d.label })), null, k => {
      pick.day = ds.filter(d => d.off === k)[0];
      renderTimes();
      check();
    });
    renderTimes();
    chips($('#places'), PLACES.map(p => ({ key: p, label: p })), null, k => { pick.place = k; check(); });
  }

  // Хариу
  function msg() {
    return G.when && pick.day ? 'Тийм ээ! ' + pick.day.label + ' ' + pick.time + ' цагт ' + (SAY[pick.place] || pick.place || '') + ' болзъё 💕' : 'Тийм ээ! Болзъё 💕';
  }
  function showReply() {
    const r = $('#reply');
    const first = r.hidden;
    r.hidden = false;
    $('#msg').textContent = msg();
    if (first) r.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'nearest' });
  }
  function copy(t) {
    const fallback = () => {
      const a = document.createElement('textarea');
      a.value = t; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0';
      document.body.append(a); a.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      a.remove();
      return ok;
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(() => true, fallback);
    }
    return Promise.resolve(fallback());
  }

  // Эхлэл
  sky();
  meteorLoop();
  document.title = G.to + ', чамд зориулсан урилга';
  $('#toLine').textContent = G.to + ', чамд зориулсан урилга';
  $('#hint').textContent = G.yt ? 'Одыг товшоорой — дуу эхэлнэ' : 'Одыг товшоорой';
  $('#toName').textContent = G.to + ',';
  $('#sign').textContent = G.from ? '— ' + G.from : '';

  $('#minBtn').onclick = () => {
    const m = $('#music'), min = m.classList.toggle('min');
    document.body.classList.toggle('min-music', min);
    $('#minBtn').textContent = min ? '+ томруулах' : '— жижигрүүлэх';
    $('#minBtn').setAttribute('aria-expanded', String(!min));
  };
  // Бүтээгч «дүрсийг харуулахгүй» гэсэн бол хураасан эхэлнэ — дуу тоглосоор
  if (G.vid === false) { $('#music').classList.add('min'); document.body.classList.add('min-music'); $('#minBtn').textContent = '▶ Дүрс харах'; $('#minBtn').setAttribute('aria-expanded','false'); }

  $('#open').onclick = async () => {
    startMusic();
    buildAsk();
    show('ask');
    requestAnimationFrame(() => requestAnimationFrame(() => $('#askText').classList.add('on')));
    await wait(2700);
    $('#sign').classList.add('ready');
    $('#choices').classList.add('ready');
  };

  const NO = ['Итгэлтэй юу?', 'Одод гуниглаж байна…', 'Дахиад нэг бодоод үз', 'Сүүлчийн од…'];
  let nk = 0;
  $('#no').onclick = () => {
    const no = $('#no'), yes = $('#yes');
    shoot();
    if (nk >= NO.length) {
      no.classList.add('fall');
      setTimeout(() => { no.hidden = true; }, RM ? 0 : 900);
      yes.focus();
      return;
    }
    no.textContent = NO[nk++];
    no.style.transform = 'scale(' + (1 - nk * .12) + ')';
    no.style.opacity = String(1 - nk * .15);
    yes.style.transform = 'scale(' + (1 + nk * .1) + ')';
  };

  $('#yes').onclick = async () => {
    show('yay');
    drawHeart();
    for (let i = 0; i < 6; i++) setTimeout(shoot, i * 180);
    await wait(2200);
    show('plan');
    if (G.when) buildPlan();
    else { $('#planT').textContent = 'Хариугаа илгээгээрэй'; showReply(); }
  };

  // Хариу — утас байвал SMS, үгүй бол хуваалцах цонх, бүтэлгүйтвэл хоосон SMS
  $('#send').onclick = () => {
    const body = encodeURIComponent(msg());
    if (G.ph) { location.href = 'sms:' + G.ph + '?&body=' + body; return; }
    const sms = () => { location.href = 'sms:?&body=' + body; };
    if (navigator.share) navigator.share({ text: msg() }).catch(e => { if (!e || e.name !== 'AbortError') sms(); });  /* өөрөө хаасан бол юу ч нээхгүй */
    else sms();
  };
  $('#copy').onclick = () => copy(msg()).then(ok => {
    if (!ok) { toast('Хуулж чадсангүй — гараар сонгоорой'); return; }
    $('#copy').textContent = 'Хуулагдлаа ✓ — чатандаа буулгаарай';
    if (G.ms) { $('#msLink').href = 'https://m.me/' + G.ms; $('#msLink').hidden = false; }
  });
</script>
</body>
</html>
