<style>
:root {
  --paper:   #F7F1EA;   /* дулаан цаас */
  --card:    #FFFDFB;
  --ink:     #2C2622;
  --muted:   #8C7F76;
  --line:    #EADFD4;
  --rose:    #D9566F;   /* гол өнгө — «Тийм» */
  --rose-dk: #B8455B;
  --leaf:    #7A9A6B;
  --radius:  22px;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body:    'Onest', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(70% 55% at 50% 0%, #FDF7F1 0%, transparent 70%),
    var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 8px; }

/* ── Арын хөвөх дэлбээ — зөвхөн transform, дарагддаггүй ── */
.drift {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.drift-petal {
  position: absolute;
  top: 0;
  left: var(--x);
  width: var(--s);
  height: calc(var(--s) * 1.3);
  border-radius: 80% 0 80% 0;   /* дэлбээний хэлбэр */
  background: linear-gradient(135deg, #F2A6B6, #E98DA2);
  opacity: .45;
  transform: translate3d(0, -12vh, 0);
  animation: drift var(--d) linear var(--delay) infinite;
  will-change: transform;
}
@keyframes drift {
  from { transform: translate3d(0, -12vh, 0) rotate(0deg); }
  to   { transform: translate3d(var(--sway), 115vh, 0) rotate(300deg); }
}

/* ── Карт ── (transform бүү өг — fixed элементүүд эвдэрнэ) */
.card {
  position: relative;
  z-index: 1;
  width: min(420px, 100%);
  padding: 30px 26px 26px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: 0 1px 2px rgba(44, 38, 34, .04), 0 18px 50px rgba(44, 38, 34, .09),
              0 30px 80px -30px rgba(217, 86, 111, .22);
  text-align: center;
}
/* Дээрээс тусах зөөлөн ягаан гэрэл */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: radial-gradient(85% 45% at 50% 0%, rgba(242, 166, 182, .22), transparent 70%);
  pointer-events: none;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: .22em;
  color: var(--muted);
  text-transform: uppercase;
}

.ask {
  margin-top: 14px;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(30px, 8.5vw, 40px);
  line-height: 1.15;
}
.ask em { font-style: italic; color: var(--rose); }

.hint {
  margin-top: 10px;
  min-height: 1.6em;
  font-size: 14px;
  color: var(--muted);
}

/* ── Цэцэг — «Тийм» рүү ойртох тусам дэлгэрнэ ── */
.bloom { margin: 18px auto 6px; width: 132px; height: 132px; }
.petal {
  transform-origin: 60px 60px;
  transform: rotate(var(--a)) scale(var(--open, .18));
  opacity: calc(.35 + var(--open, .18) * .65);
  transition: transform .55s cubic-bezier(.22, 1, .36, 1), opacity .55s ease;
}
.core { transform-origin: 60px 60px; transform: scale(calc(.6 + var(--open, .18) * .4)); transition: transform .55s ease; }
.stem { stroke-dasharray: 60; stroke-dashoffset: calc(60 - var(--open, .18) * 60); transition: stroke-dashoffset .6s ease; }

/* ── Товчнууд ── */
.actions {
  position: relative;
  margin-top: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 62px;
}

.yes {
  min-height: 54px;
  padding: 0 34px;
  border-radius: 999px;
  background: var(--rose);
  color: #fff;
  font-weight: 600;
  font-size: calc(17px + var(--grow, 0) * 2.2px);
  letter-spacing: .01em;
  box-shadow: 0 10px 26px rgba(217, 86, 111, .3);
  transform: scale(calc(1 + var(--grow, 0) * .07));
  transition: transform .35s cubic-bezier(.22, 1, .36, 1), background .2s ease, font-size .35s ease;
  position: relative;
}
.yes:hover { background: var(--rose-dk); }
/* Зүрх цохилох бөгж — «туг-туг». Товчны өөрийн transform-д хүрэхгүй. */
.yes::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 0 0 2px var(--rose);
  opacity: 0;
  pointer-events: none;
  animation: beat 2.4s ease-out infinite;
}
@keyframes beat {
  0%   { transform: scale(1);    opacity: .55; }
  12%  { transform: scale(1.12); opacity: 0; }
  20%  { transform: scale(1);    opacity: .5; }
  34%  { transform: scale(1.18); opacity: 0; }
  100% { transform: scale(1.18); opacity: 0; }
}

.no {
  min-height: 46px;
  padding: 0 22px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  background: var(--card);
  transition: transform .28s cubic-bezier(.22, 1, .36, 1), opacity .28s ease;
  will-change: transform;
}
.no:hover { border-color: #DFD2C6; }
.no.gone { display: none; }

.no-note {
  font-size: 13px;
  color: var(--muted);
  padding: 0 6px;
}
.no-note[hidden] { display: none; }

.dodges {
  position: absolute;
  top: 14px; right: 14px;
  font-size: 12px;
  letter-spacing: .06em;
  color: var(--muted);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 10px;
}
.dodges[hidden] { display: none; }

/* ── Хариу дэлгэц ── */
.reply { display: none; }
.card.answered .ask-screen { display: none; }
.card.answered .reply { display: block; animation: rise .5s cubic-bezier(.22, 1, .36, 1) both; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.reply-title {
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(28px, 7.5vw, 36px);
  color: var(--rose);
}
.reply-title:focus { outline: none; }
.reply-photo {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  border-radius: 16px;
  margin: 16px 0 6px;
  background: var(--paper);
}
.reply-photo.missing { display: none; }
.reply p { margin-top: 12px; }
.sign {
  margin-top: 18px;
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--muted);
}
.again {
  margin-top: 20px;
  min-height: 44px;
  padding: 0 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font-size: 14px;
}

/* ── Өдөр, цаг сонгох ── */
.when {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
.when .when-q {
  margin: 0 0 9px;
  font-size: 13px;
  letter-spacing: .04em;
  color: var(--muted);
}
.when .chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 16px;
}
.chip {
  min-height: 48px;
  min-width: 56px;
  padding: 5px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  line-height: 1.25;
  transition: border-color .2s ease, background .2s ease, color .2s ease;
}
.chip:hover { border-color: #DFD2C6; }
.chip small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}
.chip[aria-pressed="true"] {
  border-color: var(--rose-dk);
  background: var(--rose-dk);
  color: #fff;
  font-weight: 600;
}
.chip[aria-pressed="true"] small { color: rgba(255, 255, 255, .88); }

.when .picked {
  margin: 2px 0 0;
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(20px, 5.5vw, 24px);
  color: var(--rose-dk);
}
.when .picked-note { margin: 5px 0 0; font-size: 13px; color: var(--muted); }

/* Хоёр хариу товч доошоо дараалж, бүтэн өргөнөөр */
.when-actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  margin-top: 15px;
}
.when-actions button {
  min-height: 46px;
  padding: 0 20px;
  border-radius: 999px;
  font-size: 14px;
}
.when-actions .send {
  min-height: 54px;
  font-size: 16px;
  background: var(--rose);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 8px 20px rgba(217, 86, 111, .26);
}
.when-actions .send:hover { background: var(--rose-dk); }
.copy { border: 1px solid var(--line); color: var(--muted); }
.copy:hover { border-color: #DFD2C6; }
/* Хуулсны дараа гарах Messenger холбоос */
.msgr-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  font-size: 14px;
  font-weight: 600;
  color: var(--rose-dk);
  text-decoration: none;
}
.msgr-link:hover { text-decoration: underline; }

/* ── Дуу — доор хөвөх самбар ── */
.song {
  position: fixed;
  left: 50%;
  bottom: max(10px, env(safe-area-inset-bottom));
  z-index: 20;
  width: min(320px, calc(100vw - 16px));
  padding: 8px;
  transform: translateX(-50%);
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  box-shadow: 0 14px 40px rgba(44, 38, 34, .16);
}
.song-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-left: 6px;
}
.song-label { font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.song-min {
  flex-shrink: 0;
  min-height: 44px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 13px;
  color: var(--rose-dk);
}
.song-frame {
  margin-top: 4px;
  max-height: 220px;
  overflow: hidden;
  border-radius: 12px;
  transition: max-height .3s ease, opacity .3s ease;
}
.song-frame iframe {
  display: block;
  width: 100%;
  min-width: 280px;
  min-height: 158px;
  aspect-ratio: 16 / 9;
  border: 0;
}
.song-tip { margin: 6px 4px 2px; font-size: 12px; color: var(--muted); text-align: center; }
/* Хураахад display:none БИШ — тэгвэл дуу зогсоно. Зөвхөн өндөр, тунгалаг. */
.song.min .song-frame { max-height: 0; margin-top: 0; opacity: 0; }
.song.min .song-tip { display: none; }
/* Самбар «Дахин асуух» товчийг дарахгүйн тулд доод зай */
body.has-song { padding-bottom: 290px; }
body.has-song.song-small { padding-bottom: 96px; }

/* Кредит */
.credit {
  margin-top: 14px;
  font-size: 12px;
  letter-spacing: .08em;
  color: var(--muted);
  opacity: .8;
}
.credit a { display: inline-block; padding: 10px 12px; text-decoration: none; }
.credit a:hover, .credit a:focus-visible { color: var(--rose-dk); }

[hidden] { display: none !important; }

/* ── Зүрхнүүд ── */
.heart {
  position: fixed;
  top: 100%;
  font-size: 22px;
  pointer-events: none;
  animation: float 3.2s ease-in forwards;
}
@keyframes float {
  to { transform: translateY(-110svh) rotate(var(--spin, 20deg)); opacity: 0; }
}
/* Карт z-index-тэй болсон тул зүрхнүүд картын ард орохгүйн тулд */
.heart, .mini-heart { z-index: 30; }

/* Цэцэг дэлгэрэхэд хөөрөх жижиг зүрх */
.mini-heart {
  position: fixed;
  font-size: 14px;
  color: var(--rose);
  pointer-events: none;
  animation: mini-rise 1.4s ease-out both;
}
@keyframes mini-rise {
  from { transform: translate(-50%, 0) scale(.6); opacity: .9; }
  to   { transform: translate(calc(-50% + var(--dx, 0px)), -70px) scale(1); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .no { position: static !important; transform: none !important; }
  .drift { display: none; }
}
</style>
</head>
<body>

<!-- Арын хөвөх дэлбээ — JS-ээр 8 ширхэг үүснэ -->
<div class="drift" id="drift" aria-hidden="true"></div>

<main class="card" id="card">
  <span class="dodges" id="dodges" hidden aria-live="polite"></span>

  <div class="ask-screen" id="askScreen">
    <p class="eyebrow" id="eyebrow">Жижиг асуулт</p>
    <h1 class="ask" id="ask"></h1>
    <p class="hint" id="hint" aria-live="polite"></p>

    <!-- Цэцэг: дэлгэрэлт нь --open хувьсагчаар. Зураг татдаггүй, бүгд SVG. -->
    <svg class="bloom" id="bloom" viewBox="0 0 120 120" aria-hidden="true">
      <path class="stem" d="M60 62 C58 84 58 96 60 112" fill="none" stroke="#7A9A6B" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 86 C50 80 42 82 38 88 C46 94 55 92 60 86Z" fill="#8FAE80"/>
      <g id="petals"></g>
      <circle class="core" cx="60" cy="60" r="13" fill="#F0C64E"/>
    </svg>

    <div class="actions">
      <button class="yes" id="yes" type="button"></button>
      <button class="no" id="no" type="button"></button>
      <span class="no-note" id="noNote" hidden></span>
    </div>
  </div>

  <div class="reply" id="reply">
    <h1 class="reply-title" id="replyTitle" tabindex="-1"></h1>
    <img class="reply-photo missing" id="replyPhoto" alt="" width="400" height="500">
    <div id="replyLines"></div>

    <!-- Өдөр, цаг сонгох. CONFIG.when.enabled = false бол бүхэлдээ нуугдана. -->
    <section class="when" id="when" hidden>
      <p class="when-q" id="dayQ"></p>
      <div class="chips" id="days" role="group" aria-labelledby="dayQ"></div>

      <p class="when-q" id="timeQ"></p>
      <div class="chips" id="times" role="group" aria-labelledby="timeQ"></div>

      <p class="when-q" id="placeQ" hidden></p>
      <div class="chips" id="places" role="group" aria-labelledby="placeQ" hidden></div>

      <p class="picked" id="picked" hidden aria-live="polite"></p>
      <p class="picked-note" id="pickedNote" hidden></p>

      <div class="when-actions" id="whenActions" hidden>
        <button class="send" id="send" type="button"></button>
        <button class="copy" id="copy" type="button"></button>
        <a class="msgr-link" id="msgr" target="_blank" rel="noopener" hidden></a>
      </div>
    </section>

    <p class="sign" id="sign"></p>
    <button class="again" id="again" type="button">Дахин асуух</button>
  </div>
</main>

<!-- Дууны хөвөх самбар. Картын гадна — хариу дэлгэцийн rise хөдөлгөөн
     (transform) fixed байрлалыг эвдэхгүйн тулд. -->
<aside class="song" id="song" hidden aria-label="Дуу">
  <div class="song-head">
    <p class="song-label" id="songLabel"></p>
    <button class="song-min" id="songMin" type="button" aria-expanded="true" aria-controls="songFrame">— жижигрүүлэх</button>
  </div>
  <div class="song-frame" id="songFrame"></div>
  <p class="song-tip">Дуу эхлээгүй бол тоглогч дээр нэг дараарай ▶</p>
</aside>

<footer class="credit">
  <a href="https://ghostshdee.github.io/" target="_blank" rel="noopener">Бүтээсэн: DOKAY.</a> · <a href="make.html">Өөрийнхөөрөө хийх →</a>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ЭНД ЛЭЭ ЗАСНА. Доорх мөрүүдийг өөрчлөхөд хуудас шууд өөрчлөгдөнө.
   ═══════════════════════════════════════════════════════════════════ */
const CONFIG = {

  /* Жишээ нэр — хүлээн авагчийн нэрээр соль. <title>, og:title-ыг ч гараар соль. */
  eyebrow: 'Сараад — жижиг асуулт',

  /* <em>…</em> дотор бичсэн үг ягаанаар, налуу гарна */
  ask: 'Миний гүнжээ, надтай <em>болзоонд</em> явах уу?',

  /* Эхний тайлбар, дараа нь «Үгүй» зугтах бүрд дараагийнх нь гарна */
  hints: [
    'Зөв хариулт нь ганцхан байгаа.',
    'Тэр товч тоглоом хийж байна.',
    'Цэцэг дэлгэрч эхэллээ…',
    'Үгүй товч ядраад ирлээ.',
    'Барьж чадвал баяр хүргэе.',
    'За, шийдвэрээ гаргах цаг боллоо.'
  ],

  yes: 'Тийм',
  no:  'Үгүй',

  /* Хэдэн удаа зугтсаны дараа «Үгүй» товч алга болох вэ */
  dodgeLimit: 6,
  noGoneNote: 'Үгүй гэх боломж дууслаа 😘',

  /* «Тийм» дарсны дараа гарах хэсэг */
  reply: {
    title: 'Тэгэлгүй яахав!',

    /* Мөр бүр тусдаа догол мөр болно */
    lines: [
      'Би чамайг явна гэдгийг мэдсэн юмаа.',
      'Одоо ганцхан зүйл үлдлээ — хэзээ болзох вэ?'
    ],

    /* Зураг нэмэх бол энэ хавтсанд файлаа хийгээд нэрийг нь бич.
       Жишээ: 'zurag.jpg'. Хоосон бол зураг огт харагдахгүй. */
    photo: '',
    photoAlt: 'Бидний зураг',

    signature: '— Батаа нь'   /* жишээ — илгээгчийн нэр */
  },

  /* ── Дуу ──
     «Тийм» дармагц YouTube тоглогч доод талын хөвөх самбарт гарч, дуу эхэлнэ
     (эхэнд юу ч ачаалахгүй). Самбарыг жижигрүүлж болно — дуу зогсохгүй.
     youtube — холбоосны id: youtu.be/<ЭНЭ ХЭСЭГ>. start — хэдэн секундээс.
     iPhone дээр тоглогч дээр нэг дарах шаардлагатай байж болно (Apple хаадаг).
     Хэрэггүй бол youtube: '' болгоно. */
  song: {
    youtube: 'rg0KzIXexL8',     /* OPOZIT — HURIM [LYRICS] */
    start: 0,

/* «Өөрийн нэрээр үзэх» (BACKLOG #102 — 2026-10-10).
   URL: ?n1=Сараа&n2=Батаа — n1 хүлээн авагч, n2 илгээгч. textContent-оор л ордог;
   < > " ' ` & тэмдэгтийг хасаж, 24 тэмдэгтээр хязгаарлана. */
(function personalize(C) {
  const q = new URLSearchParams(location.search);
  const clean = (v) => (v || '').replace(/[<>"'`&]/g, '').trim().slice(0, 24);
  const n1 = clean(q.get('n1')), n2 = clean(q.get('n2'));
  if (n1) C.eyebrow = `${n1} — жижиг асуулт`;
  if (n2) C.reply.signature = `— ${n2}`;
})(CONFIG);

function readGift() {
  const m = location.hash.match(/[#&]d=([A-Za-z0-9_-]{1,2000})/);
  if (!m) return null;
  try {
    const b = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
    const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))));
    const s = (v, n) => typeof v === 'string' ? v.replace(/[<>"'`&]/g, '').trim().slice(0, n) : '';
    return {
      to: s(o.to, 24), from: s(o.from, 24), ask: s(o.ask, 120),
      yt: /^[A-Za-z0-9_-]{11}$/.test(o.yt) ? o.yt : '',
      t: Number.isInteger(o.t) && o.t >= 0 && o.t <= 36000 ? o.t : 0,
      ph: /^\+?[0-9]{6,15}$/.test(o.ph) ? o.ph : '',
      ms: /^[A-Za-z0-9.]{1,50}$/.test(o.ms) ? o.ms : '',
      vid: o.vid !== 0,
      when: o.when !== 0
    };
  } catch (e) { return null; }
}

/* Бүтээгчээс ирсэн линк (#d=…) — ?n1/n2-оос давуу. Бүх утга цэвэрлэгдсэн, textContent-оор л ордог. */
(function applyGift(C, G) {
  if (!G) return;
  if (G.to) C.eyebrow = `${G.to} — жижиг асуулт`;
  C.reply.signature = G.from ? `— ${G.from}` : '';   /* жишээ нэр харилцагчид гарахгүй */
  if (G.ask) C.askText = G.ask;
  C.song.youtube = G.yt;          /* хоосон бол дуугүй */
  C.song.start = G.t;
  C.when.phone = G.ph;
  C.when.messenger = G.ms;
  C.song.video = G.vid;
  C.when.enabled = G.when;
})(CONFIG, readGift());

/* ── Цэцгийн дэлбээ үүсгэх ── */
const petals = document.getElementById('petals');
for (let i = 0; i < 6; i++) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('class', 'petal');
  p.setAttribute('d', 'M60 60 C48 40 50 20 60 10 C70 20 72 40 60 60Z');

/* ── Текстийг CONFIG-оос ── */
const card = document.getElementById('card');
const askEl = document.getElementById('ask');
const hintEl = document.getElementById('hint');
const yesBtn = document.getElementById('yes');
const noBtn = document.getElementById('no');
const noNote = document.getElementById('noNote');
const dodgeChip = document.getElementById('dodges');
const bloom = document.getElementById('bloom');

document.getElementById('eyebrow').textContent = CONFIG.eyebrow;
if (CONFIG.askText) {
  /* Линкийн текст — innerHTML хориотой; *үг*-ийг DOM-оор <em> болгоно */
  CONFIG.askText.split('*').forEach((part, i) => {
    if (part) askEl.append(i % 2 ? Object.assign(document.createElement('em'), { textContent: part }) : part);
  });
} else {
  askEl.innerHTML = CONFIG.ask;   /* зөвхөн CONFIG-ийн текст */
}
hintEl.textContent = CONFIG.hints[0];
yesBtn.textContent = CONFIG.yes;
noBtn.textContent = CONFIG.no;
document.title = askEl.textContent;

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let dodges = 0;
let home = null;   /* «Үгүй» товчны анхны байрлал */

function bloomTo(value) {
  bloom.style.setProperty('--open', String(Math.min(1, value)));
}
bloomTo(0.18);

/* ── Арын хөвөх 8 дэлбээ (.petal биш — тэр нь цэцгийнх) ── */
const drift = document.getElementById('drift');
for (let i = 0; i < 8; i++) {
  const p = document.createElement('span');
  p.className = 'drift-petal';
  const d = 14 + Math.random() * 10;   /* 14–24 сек */
  p.style.setProperty('--x', `${(i * 12.5 + Math.random() * 8).toFixed(1)}vw`);
  p.style.setProperty('--s', `${Math.round(10 + Math.random() * 10)}px`);
  p.style.setProperty('--d', `${d.toFixed(1)}s`);
  p.style.setProperty('--delay', `${(-Math.random() * d).toFixed(1)}s`);   /* эхнээсээ тархсан */
  p.style.setProperty('--sway', `${Math.round(Math.random() * 120 - 60)}px`);
  drift.appendChild(p);
}

/* Цэцэг дэлгэрэхэд дээш хөөрөх жижиг зүрх (.heart биш) */
function riseHearts(n) {
  if (reduceMotion) return;
  const r = bloom.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const h = document.createElement('span');
    h.className = 'mini-heart';
    h.textContent = '♥';
    h.setAttribute('aria-hidden', 'true');
    h.style.left = `${r.left + r.width / 2 + (i - (n - 1) / 2) * 16}px`;
    h.style.top = `${r.top + r.height * 0.3}px`;
    h.style.setProperty('--dx', `${Math.round(Math.random() * 24 - 12)}px`);
    h.style.animationDelay = `${i * 0.12}s`;
    h.addEventListener('animationend', () => h.remove());
    document.body.appendChild(h);
  }
}

/* ── «Үгүй» зугтана ── */
function dodge() {
  dodges++;
  const step = Math.min(dodges, CONFIG.hints.length - 1);
  hintEl.textContent = CONFIG.hints[step];
  dodgeChip.hidden = false;
  dodgeChip.textContent = `${dodges} удаа зугтлаа`;

  /* Тийм товч томорч, цэцэг дэлгэрнэ */
  card.style.setProperty('--grow', String(Math.min(dodges, 5)));
  bloomTo(0.18 + dodges * 0.16);
  riseHearts(3);

  if (dodges >= CONFIG.dodgeLimit) {
    noBtn.classList.add('gone');
    noNote.textContent = CONFIG.noGoneNote;
    noNote.hidden = false;
    yesBtn.focus();
    return;
  }

  if (reduceMotion) return;   /* хөдөлгөөн багасгасан бол товч байрандаа үлдэнэ */

  /* Анхны байрлалыг нэг удаа хэмжинэ — дараа нь түүнээс тооцно */
  if (!home) {
    const r = noBtn.getBoundingClientRect();
    home = { left: r.left, top: r.top, w: r.width, h: r.height };
  }

  /* Дэлгэцээс ГАРАХГҮЙ санамсаргүй байрлал. Хязгаарыг анхны байрлалаас тооцно —
     эс бөгөөс жижиг дэлгэцэнд товч хальж, хүн дарж чадахгүй болно. */
  const pad = 8;
  const minX = pad - home.left;
  const maxX = window.innerWidth - pad - home.w - home.left;
  const minY = pad - home.top;
  const maxY = window.innerHeight - pad - home.h - home.top;
  const pick = (lo, hi) => (hi <= lo ? 0 : lo + Math.random() * (hi - lo));

  noBtn.style.position = 'relative';
  noBtn.style.transform = `translate(${pick(minX, maxX).toFixed(0)}px, ${pick(minY, maxY).toFixed(0)}px)`;
}

/* Хулгана ойртоход, хуруу хүрэхэд, дарахад — бүгдэд зугтана */
noBtn.addEventListener('pointerenter', dodge);
noBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); dodge(); });
noBtn.addEventListener('click', (e) => { e.preventDefault(); dodge(); });
/* Гар ашигладаг хүнд ч шударга — Enter/Space дарвал мөн зугтана */
noBtn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dodge(); }
});

/* ── «Тийм» ── */
function hearts() {
  if (reduceMotion) return;
  for (let i = 0; i < 14; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = ['🌸', '💗', '🌷', '💐'][i % 4];
    h.style.left = `${Math.random() * 92 + 2}vw`;
    h.style.animationDelay = `${Math.random() * 0.9}s`;
    h.style.setProperty('--spin', `${Math.random() * 90 - 45}deg`);
    h.addEventListener('animationend', () => h.remove());
    document.body.appendChild(h);
  }
}

/* «Тийм» дарахад YouTube тоглогчийг үүсгэнэ. Тэр товшилт нь хөтчийн
   хувьд хэрэглэгчийн үйлдэл тул дуу шууд эхлэх боломжтой. */
function playSong() {
  const s = CONFIG.song;
  const params = new URLSearchParams({ autoplay: '1', playsinline: '1', rel: '0', start: String(s.start || 0) });
  const f = document.createElement('iframe');
  f.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(s.youtube)}?${params}`;
  f.title = s.label;
  f.allow = 'autoplay; encrypted-media; picture-in-picture';
  f.allowFullscreen = true;
  document.getElementById('songFrame').replaceChildren(f);
}

function showReply() {
  const r = CONFIG.reply;
  document.getElementById('replyTitle').textContent = r.title;

  const lines = document.getElementById('replyLines');
  lines.textContent = '';
  for (const line of r.lines) {
    const p = document.createElement('p');
    p.textContent = line;
    lines.appendChild(p);
  }

  const img = document.getElementById('replyPhoto');
  if (r.photo) {
    img.src = r.photo;
    img.alt = r.photoAlt || '';
    img.classList.remove('missing');
    img.onerror = () => img.classList.add('missing');   /* файл олдохгүй бол хоосон талбай үлдэхгүй */
  }

  /* Дуу доод талын хөвөх самбарт шууд эхэлнэ */
  const s = CONFIG.song;
  if (s && s.youtube) {
    document.getElementById('songLabel').textContent = s.label;
    playSong();
    document.getElementById('song').hidden = false;
    document.body.classList.add('has-song');
  }

  document.getElementById('sign').textContent = r.signature;
  card.classList.add('answered');
  dodgeChip.hidden = true;
  /* Анхаарлыг дээд гарчиг руу — «Дахин асуух» руу шилжүүлбэл хуудас доош үсэрч,
     гарчиг ба дууны тоглогч дэлгэцээс гарчихна */
  const title = document.getElementById('replyTitle');
  title.focus({ preventScroll: true });
  window.scrollTo(0, 0);
  hearts();
}

yesBtn.addEventListener('click', showReply);

/* ═══════════ Өдөр, цаг сонгох ═══════════
   Backend байхгүй. Сонгосныг нь текст болгож, хуулж эсвэл мессежээр илгээнэ. */
const WEEKDAYS = ['Ням', 'Даваа', 'Мягмар', 'Лхагва', 'Пүрэв', 'Баасан', 'Бямба'];

const whenBox = document.getElementById('when');
const dayRow = document.getElementById('days');
const timeRow = document.getElementById('times');
const placeRow = document.getElementById('places');
const pickedEl = document.getElementById('picked');
const pickedNote = document.getElementById('pickedNote');
const whenActions = document.getElementById('whenActions');
const sendBtn = document.getElementById('send');
const copyBtn = document.getElementById('copy');
const msgrBtn = document.getElementById('msgr');

let pickedDay = null;
let pickedTime = null;
let pickedPlace = null;

/* Газрын сонголт байгаа эсэх. Хоосон бол өдөр, цаг хоёр л хангалттай. */
const hasPlaces = () => Array.isArray(CONFIG.when.places) && CONFIG.when.places.length > 0;

const dayLabel = (d, i) => (i === 0 ? 'Өнөөдөр' : i === 1 ? 'Маргааш' : WEEKDAYS[d.getDay()]);
const dayText = (d) => `${d.getMonth() + 1}-р сарын ${d.getDate()}`;

/* Өнгөрсөн цаг сонгогдохоос сэргийлнэ. Оройхон нээвэл «Өнөөдөр 13:00»
   гэж сонгочих боломжгүй байх ёстой. 30 минутын бэлтгэлийн зай үлдээв. */
const CUSHION = 30;
const minutesOf = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function cutoff() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes() + CUSHION;
}
const todayHasRoom = () => CONFIG.when.times.some((t) => minutesOf(t) >= cutoff());

/** Мөрийн ганц товчийг сонгосон болгоно. btn = null бол бүгдийг тайлна. */
function mark(row, btn) {
  for (const b of row.children) b.setAttribute('aria-pressed', String(b === btn));
}

function chip(text, sub) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.setAttribute('aria-pressed', 'false');
  b.textContent = text;
  if (sub) {
    const s = document.createElement('small');
    s.textContent = sub;
    b.appendChild(s);
  }
  return b;
}

function whenText() {
  if (!pickedDay || !pickedTime) return '';
  if (hasPlaces() && !pickedPlace) return '';
  const base = `${pickedDay.label}, ${pickedDay.text}, ${pickedTime}`;
  return pickedPlace ? `${base} · ${pickedPlace.label}` : base;
}

function refreshPicked() {
  const text = whenText();
  pickedEl.hidden = !text;
  pickedNote.hidden = !text;
  whenActions.hidden = !text;
  msgrBtn.hidden = true;   /* сонголт өөрчлөгдвөл дахин хуулах хэрэгтэй */
  if (!text) return;
  pickedEl.textContent = text;
  pickedNote.textContent = CONFIG.when.pickedNote;
  copyBtn.textContent = CONFIG.when.copyLabel;   /* «Хууллаа ✓»-г буцаана */
}

/* Мессежинд илгээх байгалийн өгүүлбэр. Дэлгэц дээрх товч мөрөөс өөр —
   «Лхагва, 9-р сарын 23, 19:00 цагт болзъё» гэвэл жагсаалт шиг сонсогдоно. */
function whenPhrase() {
  if (!pickedDay || !pickedTime) return '';
  const day = pickedDay.plain ? pickedDay.label : `${pickedDay.label} гаригийн`;
  return `${day} ${pickedTime} цагт`;
}

const message = () => CONFIG.when.messageTemplate
  .replace('{when}', whenPhrase())
  .replace('{where}', pickedPlace ? pickedPlace.say : '')
  .replace('{date}', pickedDay ? pickedDay.text : '')
  .replace(/ {2,}/g, ' ');   /* газаргүй бол үлдсэн давхар зайг арилгана */

function buildWhen() {
  const w = CONFIG.when;
  if (!w || !w.enabled) return;
  whenBox.hidden = false;

  document.getElementById('dayQ').textContent = w.dayQuestion;
  document.getElementById('timeQ').textContent = w.timeQuestion;
  copyBtn.textContent = w.copyLabel;
  sendBtn.textContent = w.sendLabel;
  sendBtn.hidden = false;        /* дугааргүй ч хуваалцах цэсээр илгээнэ */
  msgrBtn.hidden = true;         /* хуулсны дараа л гарна */

  /* Өнөөдөр сонгох цаг үлдээгүй бол маргаашаас эхэлнэ */
  const today = new Date();
  const start = todayHasRoom() ? 0 : 1;
  for (let i = start; i < start + w.days; i++) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    const label = dayLabel(d, i);
    const text = dayText(d);
    const b = chip(label, text);
    b.setAttribute('aria-label', `${label}, ${text}`);
    b.addEventListener('click', () => {
      pickedDay = { label, text, today: i === 0, plain: i <= 1 };
      mark(dayRow, b);
      renderTimes();          /* өнөөдөр бол өнгөрсөн цагийг хасна */
    });
    dayRow.appendChild(b);
  }

  /* Хаана? — өдөр, цаг солиход цэвэрлэгдэхгүй, тусдаа сонголт */
  placeRow.textContent = '';   /* дахин дуудахад давхардахгүй */
  if (hasPlaces()) {
    const placeQ = document.getElementById('placeQ');
    placeQ.textContent = w.placeQuestion;
    placeQ.hidden = false;
    placeRow.hidden = false;
    for (const place of w.places) {
      const b = chip(place.label, '');
      b.addEventListener('click', () => {
        pickedPlace = place;
        mark(placeRow, b);
        refreshPicked();
      });
      placeRow.appendChild(b);
    }
  }

  renderTimes();
}

/** Цагийн чипүүдийг зурна. Өнөөдрийг сонгосон бол өнгөрсөн цаг орохгүй. */
function renderTimes() {
  timeRow.textContent = '';
  pickedTime = null;
  const cut = cutoff();
  for (const t of CONFIG.when.times) {
    if (pickedDay && pickedDay.today && minutesOf(t) < cut) continue;
    const b = chip(t, '');
    b.addEventListener('click', () => {
      pickedTime = t;
      mark(timeRow, b);
      refreshPicked();
    });
    timeRow.appendChild(b);
  }
  refreshPicked();
}

/** Текстийг хуулна. Амжилттай бол true буцаана. */
async function copyText(text) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch {
    /* http, хуучин хөтөч дээр clipboard API ажиллахгүй — нөөц арга */
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
  }
  return ok;
}

/* Хуулаад, Messenger нэр байвал «Messenger нээх →» холбоос гаргана.
   Холбоос нь <a> тул хүн өөрөө дарна — iOS popup хаахгүй. */
copyBtn.addEventListener('click', async () => {
  const w = CONFIG.when;
  const text = message();
  const ok = await copyText(text);
  copyBtn.textContent = ok ? w.copiedLabel : text;
  if (w.messenger) {
    msgrBtn.href = `https://m.me/${w.messenger}`;
    msgrBtn.textContent = w.messengerLabel;
    msgrBtn.hidden = false;
  }
});

/* Дугаар байвал шууд SMS. Үгүй бол утасны хуваалцах цэс, тэр байхгүй бол
   хаяггүй SMS — хүлээн авагч хаягаа өөрөө сонгоно.
   «?&body=» нь iOS, Android хоёуланд ажилладаг хэлбэр. */
sendBtn.addEventListener('click', async () => {
  const w = CONFIG.when;
  const text = message();
  const body = encodeURIComponent(text);
  if (w.phone) { location.href = `sms:${w.phone}?&body=${body}`; return; }
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   /* хүн өөрөө цуцалсан */
  }
  location.href = `sms:?&body=${body}`;
});

buildWhen();

/* ── Дууны самбарыг жижигрүүлэх / дэлгэх. iframe үлдэнэ — дуу зогсохгүй. ── */
const songBox = document.getElementById('song');
const songMin = document.getElementById('songMin');
function setSongSmall(small) {
  songBox.classList.toggle('min', small);
  document.body.classList.toggle('song-small', small);
  songMin.setAttribute('aria-expanded', String(!small));
  songMin.textContent = small ? '♪ дэлгэх' : '— жижигрүүлэх';
}
songMin.addEventListener('click', () => setSongSmall(!songBox.classList.contains('min')));
/* Бүтээгч «дүрсийг харуулахгүй» гэсэн бол хураасан эхэлнэ */
if (CONFIG.song.video === false) { setSongSmall(true); songMin.textContent = '▶ Дүрс харах'; }

document.getElementById('again').addEventListener('click', () => {
  card.classList.remove('answered');
  document.getElementById('songFrame').replaceChildren();   /* дууг зогсооно */
  songBox.hidden = true;
  setSongSmall(CONFIG.song.video === false);
  document.body.classList.remove('has-song');
  dodges = 0;
  card.style.setProperty('--grow', '0');
  bloomTo(0.18);
  hintEl.textContent = CONFIG.hints[0];
  noBtn.classList.remove('gone');
  noBtn.style.position = '';
  noBtn.style.transform = '';
  home = null;
  noNote.hidden = true;
  dodgeChip.hidden = true;
  pickedDay = null;
  pickedTime = null;
  pickedPlace = null;
  mark(dayRow, null);
  mark(placeRow, null);
  renderTimes();
  yesBtn.focus();
});
</script>
</body>
</html>
